# promtool test rules alerts/promql_test.yaml
rule_files:
  - promql.yaml

evaluation_interval: 1m

tests:
  # Default DEEP_SCAN_INTERVAL, 24h: the window is 50h, then the 1h for.
  - interval: 1m
    input_series:
      - series: plex_language_sync_deep_scan_last_success_timestamp_seconds{job="plex-language-sync",instance="a"}
        values: 0x4000
      - series: plex_language_sync_deep_scan_interval_seconds{job="plex-language-sync",instance="a"}
        values: 86400x4000
      - series: process_start_time_seconds{job="plex-language-sync",instance="a"}
        values: 0x4000
    alert_rule_test:
      - eval_time: 49h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts: []
      - eval_time: 50h30m
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts: []
      - eval_time: 52h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: plex-language-sync
              instance: a
            exp_annotations:
              summary: "no complete plex-language-sync deep scan in two intervals"
              description: "No deep scan has covered its whole window for two scan intervals plus 2h. Missed episodes then get no tracks. Read the `deep analysis completed` lines with `complete=false`.\n"

  # Passes that keep completing every 24h never fire it.
  - interval: 1m
    input_series:
      - series: plex_language_sync_deep_scan_last_success_timestamp_seconds{job="plex-language-sync",instance="a"}
        values: 0x1439 86400x1439 172800x1439 259200x1430
      - series: plex_language_sync_deep_scan_interval_seconds{job="plex-language-sync",instance="a"}
        values: 86400x5750
      - series: process_start_time_seconds{job="plex-language-sync",instance="a"}
        values: 0x5750
    alert_rule_test:
      - eval_time: 95h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts: []

  # With no complete pass ever recorded the gauge reads 0, so a process younger
  # than the window is not stalled yet.
  - interval: 1m
    input_series:
      - series: plex_language_sync_deep_scan_last_success_timestamp_seconds{job="plex-language-sync",instance="a"}
        values: 0x4000
      - series: plex_language_sync_deep_scan_interval_seconds{job="plex-language-sync",instance="a"}
        values: 86400x4000
      - series: process_start_time_seconds{job="plex-language-sync",instance="a"}
        values: 144000x4000
    alert_rule_test:
      - eval_time: 60h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts: []

  # A container restarted every 40h whose passes never complete: the gauge
  # holds the recorded pass at 2h across restarts, so the alert is firing by
  # 54h although the process is 14h old.
  - interval: 1m
    input_series:
      - series: plex_language_sync_deep_scan_last_success_timestamp_seconds{job="plex-language-sync",instance="a"}
        values: 7200x4000
      - series: plex_language_sync_deep_scan_interval_seconds{job="plex-language-sync",instance="a"}
        values: 86400x4000
      - series: process_start_time_seconds{job="plex-language-sync",instance="a"}
        values: 0x2399 144000x2390
    alert_rule_test:
      - eval_time: 51h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts: []
      - eval_time: 54h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: plex-language-sync
              instance: a
            exp_annotations:
              summary: "no complete plex-language-sync deep scan in two intervals"
              description: "No deep scan has covered its whole window for two scan intervals plus 2h. Missed episodes then get no tracks. Read the `deep analysis completed` lines with `complete=false`.\n"

  # DEEP_SCAN_INTERVAL=6h: the window is 14h, not a fixed 50h.
  - interval: 1m
    input_series:
      - series: plex_language_sync_deep_scan_last_success_timestamp_seconds{job="plex-language-sync",instance="a"}
        values: 0x2000
      - series: plex_language_sync_deep_scan_interval_seconds{job="plex-language-sync",instance="a"}
        values: 21600x2000
      - series: process_start_time_seconds{job="plex-language-sync",instance="a"}
        values: 0x2000
    alert_rule_test:
      - eval_time: 13h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts: []
      - eval_time: 16h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: plex-language-sync
              instance: a
            exp_annotations:
              summary: "no complete plex-language-sync deep scan in two intervals"
              description: "No deep scan has covered its whole window for two scan intervals plus 2h. Missed episodes then get no tracks. Read the `deep analysis completed` lines with `complete=false`.\n"

  # DEEP_SCAN_INTERVAL=48h: the window is 98h, so a gap a fixed 50h would page
  # on is one normal interval.
  - interval: 1m
    input_series:
      - series: plex_language_sync_deep_scan_last_success_timestamp_seconds{job="plex-language-sync",instance="a"}
        values: 0x7000
      - series: plex_language_sync_deep_scan_interval_seconds{job="plex-language-sync",instance="a"}
        values: 172800x7000
      - series: process_start_time_seconds{job="plex-language-sync",instance="a"}
        values: 0x7000
    alert_rule_test:
      - eval_time: 52h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts: []
      - eval_time: 97h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts: []
      - eval_time: 100h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: plex-language-sync
              instance: a
            exp_annotations:
              summary: "no complete plex-language-sync deep scan in two intervals"
              description: "No deep scan has covered its whole window for two scan intervals plus 2h. Missed episodes then get no tracks. Read the `deep analysis completed` lines with `complete=false`.\n"

  # DEEP_SCAN_INTERVAL=off: the gauge reads 0 and the rule stays silent.
  - interval: 1m
    input_series:
      - series: plex_language_sync_deep_scan_last_success_timestamp_seconds{job="plex-language-sync",instance="a"}
        values: 0x13000
      - series: plex_language_sync_deep_scan_interval_seconds{job="plex-language-sync",instance="a"}
        values: 0x13000
      - series: process_start_time_seconds{job="plex-language-sync",instance="a"}
        values: 0x13000
    alert_rule_test:
      - eval_time: 200h
        alertname: PlexLanguageSyncDeepScanStalled
        exp_alerts: []

  # A failing scrape and a missing target both fire the down alert after 5m.
  - interval: 1m
    input_series:
      - series: up{job="plex-language-sync",instance="a"}
        values: 1x5 0x20
    alert_rule_test:
      - eval_time: 10m
        alertname: PlexLanguageSyncDown
        exp_alerts: []
      - eval_time: 11m
        alertname: PlexLanguageSyncDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: plex-language-sync
              instance: a
            exp_annotations:
              summary: "plex-language-sync is not being scraped"
              description: "No successful scrape of plex-language-sync for 5m, or no scrape target at all. Check that the container runs, METRICS_LISTEN_ADDR is set and the scrape job is named plex-language-sync.\n"
  - interval: 1m
    input_series:
      - series: up{job="other",instance="b"}
        values: 1x20
    alert_rule_test:
      - eval_time: 4m
        alertname: PlexLanguageSyncDown
        exp_alerts: []
      - eval_time: 5m
        alertname: PlexLanguageSyncDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: plex-language-sync
            exp_annotations:
              summary: "plex-language-sync is not being scraped"
              description: "No successful scrape of plex-language-sync for 5m, or no scrape target at all. Check that the container runs, METRICS_LISTEN_ADDR is set and the scrape job is named plex-language-sync.\n"

  # The WebSocket alert waits 10m and clears on reconnect.
  - interval: 1m
    input_series:
      - series: plex_language_sync_websocket_connected{job="plex-language-sync",instance="a"}
        values: 1x5 0x20 1x20
    alert_rule_test:
      - eval_time: 15m
        alertname: PlexLanguageSyncWebSocketDown
        exp_alerts: []
      - eval_time: 16m
        alertname: PlexLanguageSyncWebSocketDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: plex-language-sync
              instance: a
            exp_annotations:
              summary: "plex-language-sync is not receiving Plex notifications"
              description: "The Plex WebSocket stream has been down for 10m, so no play or library event is handled. Check that Plex is up and reachable and that PLEX_TOKEN is still valid.\n"
      - eval_time: 35m
        alertname: PlexLanguageSyncWebSocketDown
        exp_alerts: []

  # The stall alert holds while the gauge holds, past any fixed window, and
  # clears on recovery.
  - interval: 1m
    input_series:
      - series: plex_language_sync_user_resolution_stalled{job="plex-language-sync",instance="a",cause="sessions_unreadable"}
        values: 0x29 1x609 0x50
      - series: plex_language_sync_user_resolution_stalled{job="plex-language-sync",instance="a",cause="all_clients_absent"}
        values: 0x670
    alert_rule_test:
      - eval_time: 8h
        alertname: PlexLanguageSyncResolutionStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: plex-language-sync
              instance: a
              cause: sessions_unreadable
            exp_annotations:
              summary: "plex-language-sync is attributing no playback to any user"
              description: "No language choices are saved. Read the `cause` label. For `sessions_unreadable`, check PLEX_TOKEN admin rights and the server. For `all_clients_absent`, session matching is failing.\n"
      - eval_time: 11h
        alertname: PlexLanguageSyncResolutionStalled
        exp_alerts: []

  # One failed save fires the cache alert for an hour.
  - interval: 5m
    input_series:
      - series: plex_language_sync_cache_save_failures_total{job="plex-language-sync",instance="a"}
        values: 0x6 1x30
    alert_rule_test:
      - eval_time: 25m
        alertname: PlexLanguageSyncCacheSaveFailed
        exp_alerts: []
      - eval_time: 50m
        alertname: PlexLanguageSyncCacheSaveFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: plex-language-sync
              instance: a
            exp_annotations:
              summary: "plex-language-sync could not save its cache"
              description: "A save of the cache to /config failed in the last hour, so learned profiles and user tokens may be lost on the next restart. Give the container user write access to /config.\n"
      - eval_time: 2h30m
        alertname: PlexLanguageSyncCacheSaveFailed
        exp_alerts: []

  # The dashboard's per-interval counts; TestDashboardCounterSlotsAreTheTestedQueries pins them to the panels.
  - name: "Reconnect attempts: a slot counts the reconnects in it"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_websocket_reconnects_total{job="plex-language-sync",instance="a"}'
        values: "0+1x30"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x30"
    promql_expr_test:
      - expr: &reconnect_attempts 'round(sum by (instance) ((((plex_language_sync_websocket_reconnects_total{instance="a"} - last_over_time(plex_language_sync_websocket_reconnects_total{instance="a"}[1h] offset 5m)) unless on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 5m)) or (process_start_time_seconds{instance="a"} > time() - 300000 / 1000))) or (plex_language_sync_websocket_reconnects_total{instance="a"} and on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 5m)) or (process_start_time_seconds{instance="a"} > time() - 300000 / 1000))) or (plex_language_sync_websocket_reconnects_total{instance="a"} - min_over_time(plex_language_sync_websocket_reconnects_total{instance="a"}[5m])))))'
        eval_time: 20m
        exp_samples:
          - labels: '{instance="a"}'
            value: 5
  - name: "Reconnect attempts: a quiet slot reads 0"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_websocket_reconnects_total{job="plex-language-sync",instance="a"}'
        values: "3x40"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x40"
    promql_expr_test:
      - expr: *reconnect_attempts
        eval_time: 30m
        exp_samples:
          - labels: '{instance="a"}'
            value: 0
  - name: "Reconnect attempts: a restart counts the new total even when it matches the old one"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_websocket_reconnects_total{job="plex-language-sync",instance="a"}'
        values: "1x29 1x20"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x29 1770x20"
    promql_expr_test:
      - expr: *reconnect_attempts
        eval_time: 34m
        exp_samples:
          - labels: '{instance="a"}'
            value: 1
  - name: "Reconnect attempts: a failed scrape during the restart does not hide it"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_websocket_reconnects_total{job="plex-language-sync",instance="a"}'
        values: "1x28 stale 1x20"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x28 stale 1770x20"
    promql_expr_test:
      - expr: *reconnect_attempts
        eval_time: 34m
        exp_samples:
          - labels: '{instance="a"}'
            value: 1
  - name: "Reconnect attempts: a restart counts the new total, not the drop from the old one"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_websocket_reconnects_total{job="plex-language-sync",instance="a"}'
        values: "3x29 0 2 3 4x20"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x29 1770x20"
    promql_expr_test:
      - expr: *reconnect_attempts
        eval_time: 34m
        exp_samples:
          - labels: '{instance="a"}'
            value: 4
  - name: "Reconnect attempts: the slot after a restart reads 0"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_websocket_reconnects_total{job="plex-language-sync",instance="a"}'
        values: "1x29 1x20"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x29 1770x20"
    promql_expr_test:
      - expr: *reconnect_attempts
        eval_time: 39m
        exp_samples:
          - labels: '{instance="a"}'
            value: 0
  - name: "Reconnect attempts: a start just before a slot ends counts in the slot of its first scrape"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_websocket_reconnects_total{job="plex-language-sync",instance="a"}'
        values: "3x29 _ 1x20"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x29 _ 1794x20"
    promql_expr_test:
      - expr: *reconnect_attempts
        eval_time: 35m
        exp_samples:
          - labels: '{instance="a"}'
            value: 1
  - name: "Reconnect attempts: a first scrape counts the growth inside the slot, not the lifetime total"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_websocket_reconnects_total{job="plex-language-sync",instance="a"}'
        values: "_x29 7 7 8x10"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "_x29 0x12"
    promql_expr_test:
      - expr: *reconnect_attempts
        eval_time: 33m
        exp_samples:
          - labels: '{instance="a"}'
            value: 1
  - name: "Reconnect attempts: a failed scrape at a slot's start moves that slot's reconnects into the next one"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_websocket_reconnects_total{job="plex-language-sync",instance="a"}'
        values: "0+1x27 stale 29+1x12"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x27 stale 0x12"
    promql_expr_test:
      - expr: *reconnect_attempts
        eval_time: 33m
        exp_samples:
          - labels: '{instance="a"}'
            value: 6
  - name: "Reconnect attempts: a scrape outage that leaves no stale marker moves its reconnects into the slot after it"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_websocket_reconnects_total{job="plex-language-sync",instance="a"}'
        values: "0+1x20 _x10 31+1x10"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x20 _x10 0x10"
    promql_expr_test:
      - expr: *reconnect_attempts
        eval_time: 30m
        exp_samples: []
      - expr: *reconnect_attempts
        eval_time: 35m
        exp_samples:
          - labels: '{instance="a"}'
            value: 15
  - name: "Reconnect attempts: a 15s slot counts a new process whose restart a failed scrape hid"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_websocket_reconnects_total{job="plex-language-sync",instance="a"}'
        values: "3x28 stale 2x10"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x28 stale 1760x10"
    promql_expr_test:
      - expr: &reconnect_attempts_15s 'round(sum by (instance) ((((plex_language_sync_websocket_reconnects_total{instance="a"} - last_over_time(plex_language_sync_websocket_reconnects_total{instance="a"}[1h] offset 15s)) unless on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 15s)) or (process_start_time_seconds{instance="a"} > time() - 15000 / 1000))) or (plex_language_sync_websocket_reconnects_total{instance="a"} and on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 15s)) or (process_start_time_seconds{instance="a"} > time() - 15000 / 1000))) or (plex_language_sync_websocket_reconnects_total{instance="a"} - min_over_time(plex_language_sync_websocket_reconnects_total{instance="a"}[15s])))))'
        eval_time: 30m
        exp_samples:
          - labels: '{instance="a"}'
            value: 2
      - expr: &reconnect_attempts_15s_total 'sum_over_time((round(sum by (instance) ((((plex_language_sync_websocket_reconnects_total{instance="a"} - last_over_time(plex_language_sync_websocket_reconnects_total{instance="a"}[1h] offset 15s)) unless on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 15s)) or (process_start_time_seconds{instance="a"} > time() - 15000 / 1000))) or (plex_language_sync_websocket_reconnects_total{instance="a"} and on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 15s)) or (process_start_time_seconds{instance="a"} > time() - 15000 / 1000))) or (plex_language_sync_websocket_reconnects_total{instance="a"} - min_over_time(plex_language_sync_websocket_reconnects_total{instance="a"}[15s]))))))[3m:15s])'
        eval_time: 32m
        exp_samples:
          - labels: '{instance="a"}'
            value: 2
  - name: "Track selections written: a slot counts each kind's writes by result"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_track_updates_total{job="plex-language-sync",instance="a",kind="audio",result="set"}'
        values: "0+1x30"
      - series: 'plex_language_sync_track_updates_total{job="plex-language-sync",instance="a",kind="subtitle",result="set"}'
        values: "0+3x30"
      - series: 'plex_language_sync_track_updates_total{job="plex-language-sync",instance="a",kind="subtitle",result="failed"}'
        values: "0+2x30"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x30"
    promql_expr_test:
      - expr: &track_selections_set 'round(label_replace(label_replace(sum by (kind) ((((plex_language_sync_track_updates_total{instance="a", result="set"} - last_over_time(plex_language_sync_track_updates_total{instance="a", result="set"}[1h] offset 5m)) unless on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 5m)) or (process_start_time_seconds{instance="a"} > time() - 300000 / 1000))) or (plex_language_sync_track_updates_total{instance="a", result="set"} and on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 5m)) or (process_start_time_seconds{instance="a"} > time() - 300000 / 1000))) or (plex_language_sync_track_updates_total{instance="a", result="set"} - min_over_time(plex_language_sync_track_updates_total{instance="a", result="set"}[5m])))), "kind", "Audio", "kind", "audio"), "kind", "Subtitle", "kind", "subtitle"))'
        eval_time: 20m
        exp_samples:
          - labels: '{kind="Audio"}'
            value: 5
          - labels: '{kind="Subtitle"}'
            value: 15
      - expr: &track_selections_failed 'round(label_replace(label_replace(sum by (kind) ((((plex_language_sync_track_updates_total{instance="a", result="failed"} - last_over_time(plex_language_sync_track_updates_total{instance="a", result="failed"}[1h] offset 5m)) unless on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 5m)) or (process_start_time_seconds{instance="a"} > time() - 300000 / 1000))) or (plex_language_sync_track_updates_total{instance="a", result="failed"} and on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 5m)) or (process_start_time_seconds{instance="a"} > time() - 300000 / 1000))) or (plex_language_sync_track_updates_total{instance="a", result="failed"} - min_over_time(plex_language_sync_track_updates_total{instance="a", result="failed"}[5m])))), "kind", "Audio", "kind", "audio"), "kind", "Subtitle", "kind", "subtitle"))'
        eval_time: 20m
        exp_samples:
          - labels: '{kind="Subtitle"}'
            value: 10
  - name: "Track selections written: a restart counts each series from zero"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_track_updates_total{job="plex-language-sync",instance="a",kind="audio",result="set"}'
        values: "4x29 2x20"
      - series: 'plex_language_sync_track_updates_total{job="plex-language-sync",instance="a",kind="subtitle",result="set"}'
        values: "6x29 0x20"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x29 1770x20"
    promql_expr_test:
      - expr: *track_selections_set
        eval_time: 34m
        exp_samples:
          - labels: '{kind="Audio"}'
            value: 2
          - labels: '{kind="Subtitle"}'
            value: 0
  - name: "Plays handled: a slot counts the plays in it by outcome"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_play_events_total{job="plex-language-sync",instance="a",outcome="attributed"}'
        values: "0+1x30"
      - series: 'plex_language_sync_play_events_total{job="plex-language-sync",instance="a",outcome="skipped"}'
        values: "2x30"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x30"
    promql_expr_test:
      - expr: &plays_handled 'label_replace(label_replace(round(sum by (outcome) ((((plex_language_sync_play_events_total{instance="a"} - last_over_time(plex_language_sync_play_events_total{instance="a"}[1h] offset 5m)) unless on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 5m)) or (process_start_time_seconds{instance="a"} > time() - 300000 / 1000))) or (plex_language_sync_play_events_total{instance="a"} and on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 5m)) or (process_start_time_seconds{instance="a"} > time() - 300000 / 1000))) or (plex_language_sync_play_events_total{instance="a"} - min_over_time(plex_language_sync_play_events_total{instance="a"}[5m]))))), "outcome", "Matched to a user", "outcome", "attributed"), "outcome", "Skipped, no user", "outcome", "skipped")'
        eval_time: 20m
        exp_samples:
          - labels: '{outcome="Matched to a user"}'
            value: 5
          - labels: '{outcome="Skipped, no user"}'
            value: 0
  - name: "Deep scans finished: a slot counts the scans that finished in it by result"
    interval: 1m
    input_series:
      - series: 'plex_language_sync_deep_scan_runs_total{job="plex-language-sync",instance="a",result="complete"}'
        values: "0x9 1x30"
      - series: 'plex_language_sync_deep_scan_runs_total{job="plex-language-sync",instance="a",result="incomplete"}'
        values: "0x30"
      - series: 'process_start_time_seconds{job="plex-language-sync",instance="a"}'
        values: "0x40"
    promql_expr_test:
      - expr: &deep_scans_finished 'label_replace(label_replace(round(sum by (result) ((((plex_language_sync_deep_scan_runs_total{instance="a"} - last_over_time(plex_language_sync_deep_scan_runs_total{instance="a"}[1h] offset 5m)) unless on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 5m)) or (process_start_time_seconds{instance="a"} > time() - 300000 / 1000))) or (plex_language_sync_deep_scan_runs_total{instance="a"} and on (instance) ((process_start_time_seconds{instance="a"} != last_over_time(process_start_time_seconds{instance="a"}[1h] offset 5m)) or (process_start_time_seconds{instance="a"} > time() - 300000 / 1000))) or (plex_language_sync_deep_scan_runs_total{instance="a"} - min_over_time(plex_language_sync_deep_scan_runs_total{instance="a"}[5m]))))), "result", "Complete", "result", "complete"), "result", "Incomplete", "result", "incomplete")'
        eval_time: 12m
        exp_samples:
          - labels: '{result="Complete"}'
            value: 1
          - labels: '{result="Incomplete"}'
            value: 0
      - expr: *deep_scans_finished
        eval_time: 20m
        exp_samples:
          - labels: '{result="Complete"}'
            value: 0
          - labels: '{result="Incomplete"}'
            value: 0
