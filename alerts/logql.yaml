# Recommended LogQL alert rules for plex-language-sync, for Loki's ruler.
# Ship the container's logs to Loki and load this file into Loki's ruler.
# The rules read INFO lines, so keep LOG_LEVEL at info or debug.
# The deadman's 50h window fits the default 24h DEEP_SCAN_INTERVAL: for
# another interval, set it to two intervals plus 2h; with the scan off, drop it.
# Thresholds and severity labels are starting points. Change the container
# selector to the label your log collector sets, such as job or service.
groups:
  - name: plex-language-sync
    rules:
      - alert: PlexLanguageSyncDeepScanStalled
        expr: |
          absent_over_time({container="plex-language-sync"} |= `deep analysis completed` |= `complete=true` [50h])
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "no complete plex-language-sync deep scan in 50h"
          description: >
            No deep scan has covered its whole window in 50h, two scan
            intervals plus 2h. Missed episodes then get no tracks. Rule out a
            stopped container or log pipeline, then read the `deep analysis
            completed` lines with `complete=false`.
      - alert: PlexLanguageSyncErrorLog
        expr: |
          sum by (container) (count_over_time(
            {container="plex-language-sync"} |= `level=ERROR` [15m]
          )) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "plex-language-sync emitting repeated ERROR logs"
          description: >
            plex-language-sync logged 3 or more ERROR lines in 15m. A bad
            setting or an unwritable /config ends in a restart loop. A WebSocket
            that will not reconnect also logs ERROR. Read the lines.
      - alert: PlexLanguageSyncResolutionStalled
        expr: |
          sum by (container) (count_over_time(
            {container="plex-language-sync"} |= `user resolution stalled` [6h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "plex-language-sync is attributing no playback to any user"
          description: >
            No language choices are saved. Read the `cause` field: for
            `sessions_unreadable`, check PLEX_TOKEN admin rights and the server;
            for `all_clients_absent`, session matching is failing. The alert
            holds 6h and does not track recovery.
