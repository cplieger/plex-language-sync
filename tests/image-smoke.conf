# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). With no port open, the smoke waits for the image
# HEALTHCHECK (`plex-language-sync health`, which reads
# /dev/shm/plex-language-sync.healthy) to report "healthy". The dummy
# PLEX_URL is unreachable, a transient connect failure: the app starts
# healthy-degraded and keeps retrying, so it goes healthy without a live
# Plex. A fatal config error (a token Plex answers 401 to) exits instead.
SMOKE_APP_NAME=plex-language-sync
# HEALTHCHECK start-period 15s, interval 30s: 90 covers it and two intervals.
SMOKE_TIMEOUT=90
SMOKE_RUN_ARGS="-e PLEX_URL=http://127.0.0.1:1 -e PLEX_TOKEN=smoke-token"

SMOKE_LICENSE_TREE=1
